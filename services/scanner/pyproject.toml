[project]
name = "abx-scanner"
version = "0.1.0"
description = "AgentBlackBox credential scanner workers (AWS, GitHub)"
requires-python = ">=3.12"
dependencies = [
    "abx-schemas",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "boto3>=1.35",
    # GitHub App JWT auth (RS256). GitHub REST calls themselves use stdlib urllib.
    "pyjwt[crypto]>=2.10",
]

[project.scripts]
abx-scanner-worker = "abx_scanner.worker:main"
abx-scanner-local = "abx_scanner.local:main"

[tool.uv.sources]
abx-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_scanner"]
