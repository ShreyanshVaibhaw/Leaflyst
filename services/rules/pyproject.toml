[project]
name = "abx-rules"
version = "0.1.0"
description = "AgentBlackBox anomaly rule engine + alert dispatch"
requires-python = ">=3.12"
dependencies = ["abx-schemas", "psycopg[binary]>=3.2", "redis>=5.2"]

[tool.uv.sources]
abx-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_rules"]
