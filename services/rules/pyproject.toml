[project]
name = "abx-rules"
version = "0.1.0"
description = "Explainable anomaly rules for Leaflyst events"
requires-python = ">=3.12"
dependencies = ["redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_rules"]
