name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A workflow token that can write to the repository
# is a supply-chain credential, and every step here only needs to read the code.
# No job widens this, and none reads a secret, so a pull request from a fork gets
# the same token as any other run and can neither publish nor tamper.
permissions:
  contents: read

# Every action is pinned to a full commit SHA with its release in a comment. A
# tag is a mutable pointer: whoever can move it can run their code with this
# workflow's token, which is the whole shape of the tj-actions/changed-files
# compromise. The comment is there so the pin stays legible to a human reviewer.
#
# One behaviour change came with these versions: setup-uv v9 stopped pruning its
# cache by default, to reduce load on PyPI. Its default is kept, so uv caches are
# larger than before and may evict other caches sooner. That costs build time,
# never correctness.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # pnpm + node are needed by the codegen drift check (TS generation)
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck (strict on core packages)
        run: uv run mypy
      - name: Schema codegen drift check
        run: uv run python packages/schemas/scripts/codegen.py --check
      - name: API contract drift check
        run: uv run python packages/schemas/scripts/api_contracts.py --check
      # Without these services the integration tests skip, and a run that skips
      # 173 of 436 tests reports the same green as one that passes them. The
      # dev compose file is reused rather than restated so the services cannot
      # drift away from what developers run against.
      - name: Start the data stack
        run: |
          docker compose -f infra/docker-compose.dev.yml up -d --wait
          uv run python infra/migrate.py
      # ABX_REQUIRE_STACK turns "stack missing" from a skip into a failure, so a
      # broken service container surfaces as a red run instead of a quiet one.
      - name: Tests
        env:
          ABX_REQUIRE_STACK: "1"
        run: uv run pytest -q -rs
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs
      - name: Stop the data stack
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down --volumes

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      # Development dependencies are not shipped, but they execute on every
      # contributor machine and in this runner, which is a supply-chain path
      # into the release even though it is not a path into the image.
      - name: Development dependency audit
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm exec eslint .
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm exec next build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning is worthless against the tip alone: a credential
          # that was committed and then deleted is still published.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace \
            --format requirements-txt -o /tmp/requirements.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements.txt --progress-spinner off
      - name: Secret scan (working tree and full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1
      - name: Infrastructure misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 config \
            --quiet --severity MEDIUM,HIGH,CRITICAL --exit-code 1 /repo/infra

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Python release image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -f infra/docker/python.Dockerfile -t leaflyst-python:release-smoke .
      - name: Build web release image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -f infra/docker/web.Dockerfile -t leaflyst-web:release-smoke .
      # The release gate is two questions, so it is two scans. The first fails on
      # any critical, fixed or not, because a critical with no vendor patch is a
      # decision to make rather than a result to record. The second fails on
      # anything the vendor has already fixed, which is unarguable: shipping it
      # means shipping a known hole that a rebuild would have closed.
      - name: Image vulnerability scan - no criticals
        run: |
          for image in leaflyst-python leaflyst-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image --quiet --scanners vuln \
              --severity CRITICAL --exit-code 1 "$image:release-smoke"
          done
      - name: Image vulnerability scan - nothing fixable left unfixed
        run: |
          for image in leaflyst-python leaflyst-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image --quiet --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 "$image:release-smoke"
          done
      - name: Smoke release images
        run: python demo/container_smoke.py --skip-build
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.45.1
      - name: Generate and verify release provenance
        run: |
          python tools/release_manifest.py --output release-artifacts --require-clean --syft "${{ steps.syft.outputs.cmd }}"
          python tools/release_manifest.py --verify release-artifacts/release-manifest.json
      # A verifier that has never been seen to fail is not evidence of anything.
      # One injected package into a copy of the SBOM must break verification, or
      # the provenance above is decoration.
      - name: Prove the provenance check detects tampering
        run: |
          cp -r release-artifacts /tmp/tampered
          python - <<'PY'
          from pathlib import Path
          sbom = Path("/tmp/tampered/python.cdx.json")
          text = sbom.read_text(encoding="utf-8")
          marker = '"components":['
          assert marker in text, "unexpected SBOM shape"
          sbom.write_text(
              text.replace(marker, marker + '{"type":"library","name":"not-really-here","version":"1.0.0"},', 1),
              encoding="utf-8",
          )
          PY
          if python tools/release_manifest.py --verify /tmp/tampered/release-manifest.json; then
            echo "tampered SBOM verified as valid; the provenance check is not working" >&2
            exit 1
          fi
      - name: Retain release manifest and SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
      - name: Start release topology
        env:
          ABX_DEMO_ENABLED: "true"
        run: |
          docker tag leaflyst-python:release-smoke leaflyst-python:local
          docker tag leaflyst-web:release-smoke leaflyst-web:local
          docker compose --env-file infra/release.env.example -f infra/compose.release.yml up -d --no-build --wait
          curl --fail http://127.0.0.1:18000/readyz
          curl --fail http://127.0.0.1:13000/security
      - name: Public browser journeys
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml exec -T -e E2E_BASE_URL=http://127.0.0.1:3000 web sh -lc 'cd /app/.next && node --input-type=module' < apps/web/e2e/public-smoke.mjs
      - name: Backup and restore integrity drill
        run: python demo/recovery_drill.py --skip-build
      - name: Release topology logs
        if: failure()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml logs
      - name: Stop release topology
        if: always()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml down --volumes

  # Every gate above is asserted to actually fire. A scanner that runs, reports
  # nothing, and is believed is indistinguishable from one that is misconfigured,
  # and the difference only shows up on the day it was needed.
  #
  # These run in-workflow rather than as a one-time manual check, for the same
  # reason the SBOM tamper proof in `containers` does: a control verified once on
  # a throwaway branch tells you about that branch. Verified every run, it tells
  # you about the change in front of you.
  #
  # Each step breaks exactly one thing, in a temporary location, and fails if the
  # tool it targets does NOT reject it. Nothing here touches the repository.
  gate-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # Same reason as the python job: codegen shells out to pnpm for the
      # TypeScript half. Without these the drift probe cannot run codegen at
      # all, and "codegen exited non-zero" would read as drift detected.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: A vulnerable dependency must fail the audit
        run: |
          # requests 2.19.1 carries CVE-2018-18074. Pinned rather than latest so
          # this step does not start passing when an advisory is withdrawn.
          echo "requests==2.19.1" > /tmp/vulnerable-requirements.txt
          if uv run --with pip-audit pip-audit -r /tmp/vulnerable-requirements.txt \
              --progress-spinner off; then
            echo "pip-audit accepted a known-vulnerable pin; the audit gate is not working" >&2
            exit 1
          fi

      - name: A leaked credential must fail the secret scan
        run: |
          # Generated at runtime, high entropy, and written outside the
          # repository. Two things this deliberately is not:
          #
          # A literal in this file - gitleaks scans the repository, so a fixed
          # token here would fail the real secret-scan step.
          #
          # A low-entropy placeholder. `ghp_AAAA...` is structurally valid and
          # gitleaks ignores it, because the rules carry an entropy threshold.
          # The first version of this probe used exactly that and the step
          # passed while detecting nothing.
          mkdir -p /tmp/leak-probe
          body=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 36)
          printf 'token = "ghp_%s"\n' "$body" > /tmp/leak-probe/config.py
          if docker run --rm -v /tmp/leak-probe:/probe -v "$PWD/.gitleaks.toml:/config.toml" \
              zricethezav/gitleaks:v8.21.2 detect --source /probe --config /config.toml \
              --no-git --redact --no-banner --exit-code 1; then
            echo "gitleaks accepted a planted token; the secret gate is not working" >&2
            exit 1
          fi

      - name: A misconfigured container must fail the infrastructure scan
        run: |
          mkdir -p /tmp/iac-probe
          # No tag pin and no non-root USER: AVD-DS-0001 (MEDIUM) and
          # AVD-DS-0002 (HIGH). Verified against trivy 0.58.1 rather than
          # assumed - an earlier version of this probe used `USER root`, which
          # this scanner does not flag, so the step would have passed while
          # proving nothing.
          printf 'FROM alpine:latest\nRUN apk add --no-cache curl\n' > /tmp/iac-probe/Dockerfile
          if docker run --rm -v /tmp/iac-probe:/probe aquasec/trivy:0.58.1 config \
              --quiet --severity MEDIUM,HIGH,CRITICAL --exit-code 1 /probe; then
            echo "trivy accepted a root-user latest-tag image; the IaC gate is not working" >&2
            exit 1
          fi

      - name: Schema drift must fail the codegen check
        run: |
          uv sync --all-packages
          # Confirm the check passes before breaking it, so a check that always
          # fails cannot be mistaken for one that detects drift.
          uv run python packages/schemas/scripts/codegen.py --check
          # A file the check actually compares. `head -1` picked
          # generated/__init__.py, which codegen does not regenerate - drifting
          # it left the check green, so the probe passed while proving nothing.
          generated=packages/schemas/src/abx_schemas/generated/event.py
          test -f "$generated" || { echo "no generated file found to drift" >&2; exit 1; }
          printf '\n# drift introduced by the negative-control step\n' >> "$generated"
          if uv run python packages/schemas/scripts/codegen.py --check; then
            echo "codegen --check accepted a drifted artifact; the drift gate is not working" >&2
            exit 1
          fi
          git checkout -- "$generated"

      - name: A silently skipped integration suite must fail the tests
        run: |
          uv sync --all-packages
          # The data stack is deliberately NOT started. Without ABX_REQUIRE_STACK
          # every integration test skips and the run is green, which is how 173
          # tests once passed by not running.
          if ABX_REQUIRE_STACK=1 uv run pytest apps/api/tests/test_ingest_e2e.py -q; then
            echo "the suite passed with no data stack; the skip gate is not working" >&2
            exit 1
          fi
