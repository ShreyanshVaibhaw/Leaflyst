name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # pnpm + node are needed by the codegen drift check (TS generation)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck (strict on core packages)
        run: uv run mypy
      - name: Schema codegen drift check
        run: uv run python packages/schemas/scripts/codegen.py --check
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint .
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm exec next build

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python release image
        run: docker build -f infra/docker/python.Dockerfile -t agentblackbox-python:release-smoke .
      - name: Build web release image
        run: docker build -f infra/docker/web.Dockerfile -t agentblackbox-web:release-smoke .
      - name: Smoke release images
        run: python demo/container_smoke.py --skip-build
      - name: Start release topology
        run: |
          docker tag agentblackbox-python:release-smoke agentblackbox-python:local
          docker tag agentblackbox-web:release-smoke agentblackbox-web:local
          docker compose --env-file infra/release.env.example -f infra/compose.release.yml up -d --no-build --wait
          curl --fail http://127.0.0.1:18000/readyz
          curl --fail http://127.0.0.1:13000/security
      - name: Release topology logs
        if: failure()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml logs
      - name: Stop release topology
        if: always()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml down --volumes
