name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # pnpm + node are needed by the codegen drift check (TS generation)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck (strict on core packages)
        run: uv run mypy
      - name: Schema codegen drift check
        run: uv run python packages/schemas/scripts/codegen.py --check
      - name: API contract drift check
        run: uv run python packages/schemas/scripts/api_contracts.py --check
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      # Development dependencies are not shipped, but they execute on every
      # contributor machine and in this runner, which is a supply-chain path
      # into the release even though it is not a path into the image.
      - name: Development dependency audit
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm exec eslint .
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm exec next build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning is worthless against the tip alone: a credential
          # that was committed and then deleted is still published.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace \
            --format requirements-txt -o /tmp/requirements.txt
          uv run --with pip-audit pip-audit -r /tmp/requirements.txt --progress-spinner off
      - name: Secret scan (working tree and full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1
      - name: Infrastructure misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 config \
            --quiet --severity MEDIUM,HIGH,CRITICAL --exit-code 1 /repo/infra

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python release image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -f infra/docker/python.Dockerfile -t leaflyst-python:release-smoke .
      - name: Build web release image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -f infra/docker/web.Dockerfile -t leaflyst-web:release-smoke .
      # The release gate is two questions, so it is two scans. The first fails on
      # any critical, fixed or not, because a critical with no vendor patch is a
      # decision to make rather than a result to record. The second fails on
      # anything the vendor has already fixed, which is unarguable: shipping it
      # means shipping a known hole that a rebuild would have closed.
      - name: Image vulnerability scan - no criticals
        run: |
          for image in leaflyst-python leaflyst-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image --quiet --scanners vuln \
              --severity CRITICAL --exit-code 1 "$image:release-smoke"
          done
      - name: Image vulnerability scan - nothing fixable left unfixed
        run: |
          for image in leaflyst-python leaflyst-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.1 image --quiet --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 "$image:release-smoke"
          done
      - name: Smoke release images
        run: python demo/container_smoke.py --skip-build
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.45.1
      - name: Generate and verify release provenance
        run: |
          python tools/release_manifest.py --output release-artifacts --require-clean --syft "${{ steps.syft.outputs.cmd }}"
          python tools/release_manifest.py --verify release-artifacts/release-manifest.json
      - name: Retain release manifest and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ github.sha }}
          path: release-artifacts
          if-no-files-found: error
      - name: Start release topology
        env:
          ABX_DEMO_ENABLED: "true"
        run: |
          docker tag leaflyst-python:release-smoke leaflyst-python:local
          docker tag leaflyst-web:release-smoke leaflyst-web:local
          docker compose --env-file infra/release.env.example -f infra/compose.release.yml up -d --no-build --wait
          curl --fail http://127.0.0.1:18000/readyz
          curl --fail http://127.0.0.1:13000/security
      - name: Public browser journeys
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml exec -T -e E2E_BASE_URL=http://127.0.0.1:3000 web sh -lc 'cd /app/.next && node --input-type=module' < apps/web/e2e/public-smoke.mjs
      - name: Backup and restore integrity drill
        run: python demo/recovery_drill.py --skip-build
      - name: Release topology logs
        if: failure()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml logs
      - name: Stop release topology
        if: always()
        run: docker compose --env-file infra/release.env.example -f infra/compose.release.yml down --volumes
