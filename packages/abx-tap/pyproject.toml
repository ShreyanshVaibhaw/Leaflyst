[project]
name = "abx-tap"
version = "0.1.0"
description = "Leaflyst MCP tap: stdio proxy that records every MCP message"
requires-python = ">=3.12"
# Zero runtime dependencies on purpose: the tap sits in the customer's agent
# path and must be trivially installable and auditable. Stdlib only.
dependencies = []

[project.scripts]
abx-tap = "abx_tap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_tap"]
