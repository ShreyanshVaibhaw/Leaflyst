[project]
name = "abx-tap"
version = "0.1.0"
description = "AgentBlackBox MCP tap: stdio proxy that records every MCP message"
requires-python = ">=3.12"
dependencies = ["abx-schemas"]

[project.scripts]
abx-tap = "abx_tap.cli:main"

[tool.uv.sources]
abx-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_tap"]
