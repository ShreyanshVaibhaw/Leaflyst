[project]
name = "abx-sdk"
version = "0.1.0"
description = "AgentBlackBox Python SDK: LangGraph instrumentor emitting OTel GenAI spans"
requires-python = ">=3.12"
dependencies = ["abx-schemas"]

[tool.uv.sources]
abx-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_sdk"]
