[project]
name = "abx-api"
version = "0.1.0"
description = "AgentBlackBox API: ingest collector, app API, chain verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "abx-schemas",
    "abx-scanner",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "clickhouse-connect>=0.8",
    "redis>=5.2",
    "boto3>=1.35",
    "opentelemetry-proto>=1.42,<2",
    "protobuf>=6.31,<8",
]

[tool.uv.sources]
abx-schemas = { workspace = true }
abx-scanner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_api"]
