[project]
name = "abx-api"
version = "0.1.0"
description = "Leaflyst API: ingest collector, app API, chain verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "abx-schemas",
    "abx-scanner",
    "abx-rules",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "clickhouse-connect>=0.8",
    "redis>=5.2",
    "boto3>=1.35",
    # AES-GCM for per-payload data keys (payload_crypto).
    # >=50 for CVE-2026-69247 (Bleichenbacher oracle in PKCS#7 EnvelopedData
    # decryption). This service only uses AESGCM, so the affected path is not
    # reachable, but the advisory is vendor-fixed and the release gate refuses
    # anything a rebuild would have closed.
    "cryptography>=50",
    "opentelemetry-proto>=1.42,<2",
    "protobuf>=6.31,<8",
]

[project.scripts]
abx-alert-worker = "abx_api.alert_worker:main"

[tool.uv.sources]
abx-schemas = { workspace = true }
abx-scanner = { workspace = true }
abx-rules = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abx_api"]
