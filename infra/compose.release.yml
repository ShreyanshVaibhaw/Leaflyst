name: agentblackbox-release

x-python-image: &python-image
  image: agentblackbox-python:${ABX_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile

x-api-environment: &api-environment
  ABX_ENV: ${ABX_ENV:-staging}
  ABX_REQUIRE_HTTPS: ${ABX_REQUIRE_HTTPS:-false}
  ABX_PG_DSN: postgresql://abx:${ABX_POSTGRES_PASSWORD:?set ABX_POSTGRES_PASSWORD}@postgres:5432/abx
  ABX_CH_HOST: clickhouse
  ABX_CH_PORT: "8123"
  ABX_CH_DATABASE: abx
  ABX_CH_USER: abx_app
  ABX_CH_PASSWORD: ${ABX_CH_APP_PASSWORD:?set ABX_CH_APP_PASSWORD}
  ABX_REDIS_URL: redis://redis:6379
  ABX_S3_ENDPOINT: http://minio:9000
  ABX_S3_ACCESS_KEY: ${ABX_S3_ACCESS_KEY:?set ABX_S3_ACCESS_KEY}
  ABX_S3_SECRET_KEY: ${ABX_S3_SECRET_KEY:?set ABX_S3_SECRET_KEY}
  ABX_S3_SERVER_SIDE_ENCRYPTION: ${ABX_S3_SERVER_SIDE_ENCRYPTION:-}
  ABX_ANCHOR_RETENTION_DAYS: ${ABX_ANCHOR_RETENTION_DAYS:-3650}
  ABX_INGEST_BODY_MAX_BYTES: ${ABX_INGEST_BODY_MAX_BYTES:-67108864}
  ABX_OTLP_BODY_MAX_BYTES: ${ABX_OTLP_BODY_MAX_BYTES:-16777216}
  ABX_ADMIN_KEY: ${ABX_ADMIN_KEY:?set ABX_ADMIN_KEY}
  ABX_GITHUB_STATE_SECRET: ${ABX_GITHUB_STATE_SECRET:?set ABX_GITHUB_STATE_SECRET}
  ABX_ALLOWED_HOSTS: ${ABX_ALLOWED_HOSTS:-api,localhost,127.0.0.1}
  ABX_CORS_ORIGINS: ${ABX_CORS_ORIGINS:-http://localhost:13000}
  ABX_WEB_URL: ${ABX_WEB_URL:-http://localhost:13000}
  ABX_DEMO_ENABLED: "false"

services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: abx
      POSTGRES_PASSWORD: ${ABX_POSTGRES_PASSWORD}
      POSTGRES_DB: abx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abx -d abx"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
    environment:
      CLICKHOUSE_DB: abx
      CLICKHOUSE_USER: abx_admin
      CLICKHOUSE_PASSWORD: ${ABX_CH_ADMIN_PASSWORD:?set ABX_CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      ABX_CH_APP_PASSWORD: ${ABX_CH_APP_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/abx_app.xml:/etc/clickhouse-server/users.d/abx_app.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user abx_admin --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ABX_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ABX_S3_SECRET_KEY}
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *python-image
    command: ["python", "infra/migrate.py"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bucket-init:
    <<: *python-image
    command: ["python", "-c", "from abx_api.store import ensure_buckets; ensure_buckets()"]
    environment:
      <<: *api-environment
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python-image
    environment:
      <<: *api-environment
    ports:
      - "${ABX_API_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  scanner-worker:
    <<: *python-image
    command: ["abx-scanner-worker"]
    environment:
      <<: *api-environment
      ABX_GITHUB_APP_ID: ${ABX_GITHUB_APP_ID:-}
      ABX_GITHUB_PRIVATE_KEY: ${ABX_GITHUB_PRIVATE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; assert redis.Redis.from_url(os.environ['ABX_REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  alert-worker:
    <<: *python-image
    command: ["abx-alert-worker"]
    environment:
      <<: *api-environment
      ABX_SLACK_WEBHOOK_URL: ${ABX_SLACK_WEBHOOK_URL:-}
      ABX_RESEND_API_KEY: ${ABX_RESEND_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; assert redis.Redis.from_url(os.environ['ABX_REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  web:
    image: agentblackbox-web:${ABX_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      ABX_ENV: ${ABX_ENV:-staging}
      ABX_API_URL: ${ABX_API_URL:-http://api:8000}
      ABX_ADMIN_KEY: ${ABX_ADMIN_KEY}
      ABX_TENANT_COOKIE_SECRET: ${ABX_TENANT_COOKIE_SECRET:?set ABX_TENANT_COOKIE_SECRET}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${ABX_WEB_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  anchor:
    <<: *python-image
    profiles: ["maintenance"]
    command: ["python", "-m", "abx_api.anchor"]
    environment:
      <<: *api-environment

  retention:
    <<: *python-image
    profiles: ["maintenance"]
    command: ["python", "-m", "abx_api.retention"]
    environment:
      <<: *api-environment

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  object_data:
