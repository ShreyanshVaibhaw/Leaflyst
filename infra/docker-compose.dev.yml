name: agentblackbox-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abx
      POSTGRES_PASSWORD: abx_dev_password
      POSTGRES_DB: abx
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abx -d abx"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      CLICKHOUSE_DB: abx
      CLICKHOUSE_USER: abx_admin
      CLICKHOUSE_PASSWORD: abx_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "abx_admin", "--password", "abx_dev_password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9401"
    environment:
      MINIO_ROOT_USER: abx
      MINIO_ROOT_PASSWORD: abx_dev_password
    ports:
      - "9402:9000"
      - "9401:9401"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  ch_data:
  minio_data:
